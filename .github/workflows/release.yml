name: Release

# Publishes the plugin to the Gradle Plugin Portal when a version tag is pushed.
# Trigger: push a tag like v0.1.0  ->  git tag v0.1.0 && git push origin v0.1.0
#
# The tag version MUST match `version` in build.gradle.kts. The portal rejects a
# re-publish of an existing version, so bump the version before tagging.
on:
  push:
    tags: ["v*"]

# Never run two publishes at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Gradle Plugin Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Git identity
        # The plugin tests run `git init` / `git rev-parse` in temp projects.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Verify tag matches project version
        # Fail early if the tag (v0.1.0) does not match build.gradle.kts version.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(./gradlew -q properties --property version | awk '/^version:/ {print $2}')"
          echo "Tag version:     $TAG"
          echo "Project version: $PROJECT_VERSION"
          if [ "$TAG" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag ($TAG) does not match project version ($PROJECT_VERSION). Bump build.gradle.kts and re-tag."
            exit 1
          fi

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Publish plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          ./gradlew publishPlugins \
            -Pgradle.publish.key="$GRADLE_PUBLISH_KEY" \
            -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET" \
            --stacktrace
